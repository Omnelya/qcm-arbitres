<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QCM Arbitres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Fait le pendant de public/404.html : si cette page a été atteinte
      // via son détour (adresse encodée dans ?redirect=), on restaure la
      // vraie adresse avant que l'application ne démarre, pour que le
      // routeur (et le filet de sécurité de main.tsx) voient la bonne
      // page dès le premier rendu.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirige = params.get('redirect');
        if (redirige) {
          history.replaceState(null, '', redirige);
        }
      })();
    </script>
    <script>
      // Filet de sécurité : si l'application ne démarre pas (erreur de
      // configuration, fichier introuvable...), on affiche un message
      // lisible avec la cause technique, au lieu d'une page blanche.
      (function () {
        function afficher(detail) {
          var racine = document.getElementById('root');
          if (!racine || racine.hasChildNodes()) return;
          var boite = document.createElement('div');
          boite.style.cssText = 'max-width:28rem;margin:3rem auto;padding:0 1rem;font-family:system-ui,sans-serif';
          var titre = document.createElement('p');
          titre.style.fontWeight = '600';
          titre.textContent = "L'application n'a pas pu démarrer.";
          var aide = document.createElement('p');
          aide.style.cssText = 'color:#6B6B64;font-size:14px';
          aide.textContent = 'Recharge la page avec Ctrl+Maj+R (Cmd+Maj+R sur Mac). Si le problème continue, envoie ce message à l\'administrateur :';
          var pre = document.createElement('pre');
          pre.style.cssText = 'white-space:pre-wrap;font-size:12px;background:#F7F7F5;border:1px solid #E3E1DB;border-radius:8px;padding:8px';
          pre.textContent = String(detail);
          boite.appendChild(titre);
          boite.appendChild(aide);
          boite.appendChild(pre);
          racine.appendChild(boite);
        }
        window.addEventListener('error', function (e) {
          var cible = e.target;
          if (cible && cible.tagName === 'SCRIPT') {
            afficher('Fichier non chargé : ' + (cible.src || ''));
          } else if (e.message) {
            afficher(e.message);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          afficher(e.reason && e.reason.message ? e.reason.message : e.reason);
        });
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
